# TEMPLATE — committed seed for litellm/config.yaml (which is gitignored, since JARVIS_LOCAL_LLM.sh
# regenerates its local-routes block on every start/gateway-sync). On first gateway use the script
# copies this to litellm/config.yaml if that file is missing. Edit cloud/settings here to change the
# shipped default; day-to-day the live config.yaml is what runs.
#
# LiteLLM gateway — ONE OpenAI-compatible endpoint fronting your LOCAL models (Ollama / MLX), so
# several of them (or mixed runtimes) sit behind a single URL. JARVIS talks OpenAI dialect to it and
# picks a model by `model_name`. You DON'T need this for cloud models — point JARVIS straight at the
# provider (single mode) instead. The block below is filled in automatically; see the markers.
#
# `drop_params` makes cross-provider calls tolerant of params a given provider doesn't support.
model_list:
  # >>> BEGIN local routes — AUTO-GENERATED by JARVIS_LOCAL_LLM.sh; DO NOT hand-edit (this whole block is regenerated on 'start --gateway' / 'gateway-sync' from the live --backend). >>>
  # <<< END local routes <<<
  # (For the rare MIXED case — local + cloud behind this one endpoint in multi mode — see Docs/local-llm.md.)

litellm_settings:
  drop_params: true
  request_timeout: 600
