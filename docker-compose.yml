name: jarvis

# JARVIS multi-container stack. Everything binds to 127.0.0.1 (localhost only).
#
#   jarvis-app        Node.js backend + JS frontend (the orchestrator)        :8110
#   jarvis-memory     Mem0 semantic long-term memory (vector store)           internal-only
#   jarvis-workbench  Linux XFCE desktop (noVNC) the LLM works in as root      :8111
#   jarvis-piper      Offline neural text-to-speech (Piper), internal-only     :5000
#
# The app reaches the workbench via the Docker socket (docker exec), the memory
# service over the internal network, and mounts the shared folders into both the app
# and the workbench so files can be exchanged between you and the LLM.
#
# LLM hosting is NOT in this stack. The app talks to whatever URL is in llm.base_url —
# a cloud provider, or a local runtime managed by ./JARVIS_LOCAL_LLM.sh (reached over
# host.docker.internal). See that script for local models + the optional LiteLLM gateway.

services:
  jarvis-workbench:
    build:
      context: ./workbench
      dockerfile: Dockerfile
      args:
        # Set from workbench.base_image in JARVIS_CONFIG.json by ./JARVIS.sh --setup;
        # pin a digest there for reproducible rebuilds (see workbench/Dockerfile).
        BASE_IMAGE: ${WORKBENCH_BASE_IMAGE:-lscr.io/linuxserver/webtop:ubuntu-xfce}
    image: jarvis-workbench:local
    container_name: jarvis-workbench
    restart: unless-stopped
    # Hardened: use Docker's DEFAULT seccomp profile instead of disabling it, so the container the
    # LLM runs a root shell in can't reach the full host-kernel syscall surface. If a GUI app in the
    # workbench desktop misbehaves after this change (some webtop apps need extra syscalls), restore
    # the old behavior by UN-COMMENTING the two lines below:
    # security_opt:
    #   - seccomp:unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Los_Angeles}
      TITLE: JARVIS Workbench
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8111}:3000"
      - "127.0.0.1:9101-9150:9101-9150"   # web-app preview ports (serve_app tool)
    volumes:
      - jarvis_workbench_home:/config
      - ./LLM_WORKSPACE:/LLM_WORKSPACE
      - ./LLM_READ_ONLY_FILES:/LLM_READ_ONLY_FILES:ro
      - ./LLM_READ_WRITE_FILES:/LLM_READ_WRITE_FILES
    shm_size: "1gb"

  jarvis-memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    image: jarvis-memory:local
    container_name: jarvis-memory
    restart: unless-stopped
    environment:
      JARVIS_CONFIG_FILE: /cfg/JARVIS_CONFIG.json
      MEM0_CHROMA_PATH: /data/chroma
    # Internal-only: the app reaches it at http://jarvis-memory:8000 over the compose
    # network, and JARVIS.sh health-checks it via docker exec. No host port — the store
    # has no auth, so publishing it would let ANY local process read/rewrite the memories.
    # Uncomment below to poke it directly for debugging.
    # ports:
    #   - "127.0.0.1:${MEMORY_PORT:-8120}:8000"
    expose:
      - "8000"
    volumes:
      - ./memory/server.py:/app/server.py:ro
      - ./config/JARVIS_CONFIG.json:/cfg/JARVIS_CONFIG.json:ro
      - jarvis_memory_data:/data

  # Filtered Docker API in front of the raw socket. The app talks to THIS (over the internal
  # network) instead of mounting /var/run/docker.sock itself, so an app-process compromise can no
  # longer drive the full daemon (build images, mount host root, etc.). The app only needs to exec
  # into the workbench, so we allow the containers+exec API and POST; everything else stays denied.
  # NOTE: this blocks images/networks/volumes/swarm/system/host-info. It does not, on its own,
  # forbid container CREATE within the containers API — for maximum lockdown swap this for a
  # path-allowlisting proxy (e.g. wollomatic/socket-proxy) restricted to the workbench exec routes.
  jarvis-docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: jarvis-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # /containers/<workbench>/exec
      EXEC: "1"         # /exec/<id>/start
      POST: "1"         # exec is a POST; without this the proxy is read-only and run_shell fails
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      INFO: "0"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"

  # OPTIONAL self-hosted metasearch for the web_search tool (search.provider = "searxng"
  # in JARVIS_CONFIG.json). Under the "search" profile, so a plain `docker compose up`
  # never starts it — ./JARVIS.sh --start adds the profile automatically when the config
  # selects searxng. Internal-only: the app queries http://jarvis-searxng:8080/search
  # (uncomment the ports mapping to browse its UI for debugging).
  jarvis-searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    profiles: ["search"]
    volumes:
      - ./searxng:/etc/searxng
    expose:
      - "8080"
    # ports:
    #   - "127.0.0.1:8181:8080"

  jarvis-piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    image: jarvis-piper:local
    container_name: jarvis-piper
    restart: unless-stopped
    # Internal-only: the app reaches it over the compose network at http://jarvis-piper:5000.
    # No host port is published (uncomment below to poke it directly for debugging).
    # ports:
    #   - "127.0.0.1:5111:5000"
    expose:
      - "5000"

  jarvis-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jarvis-app
    restart: unless-stopped
    depends_on:
      jarvis-piper:
        condition: service_started
      jarvis-docker-proxy:
        condition: service_started
    # Reach a local LLM runtime / gateway running on the HOST (via ./JARVIS_LOCAL_LLM.sh).
    # Automatic on Docker Desktop (macOS/Windows); this maps it on Linux too. Cloud endpoints
    # don't need it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JARVIS_CONFIG_FILE: /cfg/JARVIS_CONFIG.json
      JARVIS_TASKS_FILE: /data/tasks.json
      PORT: "80"
      # Reach the Docker daemon ONLY through the filtered proxy (not the raw socket). To revert to
      # the direct socket: delete these two vars and re-add the docker.sock mount below.
      DOCKER_PROXY_HOST: jarvis-docker-proxy
      DOCKER_PROXY_PORT: "2375"
      # Network access + login (Config → Access & users). ./JARVIS.sh sets APP_BIND from
      # server.allow_network and tells the app this computer's addresses and names.
      JARVIS_APP_BIND: ${APP_BIND:-127.0.0.1}
      JARVIS_PUBLIC_PORT: ${APP_PORT:-8110}
      JARVIS_HOST_ADDRS: ${JARVIS_HOST_ADDRS:-}
      JARVIS_HOSTNAMES: ${JARVIS_HOSTNAMES:-}
      # The terminal client (--terminal / --prompt) runs inside this container and reaches the
      # app on the container's own loopback, which nothing outside can use — so it needs no login.
      JARVIS_TRUST_LOOPBACK: "1"
    ports:
      # 127.0.0.1 = this computer only (default); 0.0.0.0 when "Allow other devices on my
      # network" is on. The workbench desktop and preview ports above stay on 127.0.0.1.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8110}:80"
    volumes:
      - ./app:/usr/src/app:ro   # app can't rewrite its own code; host edits still live-reload (container reads them)
      - /usr/src/app/node_modules
      - ./config/JARVIS_CONFIG.json:/cfg/JARVIS_CONFIG.json   # read-write: the UI persists settings here
      - ./config/JARVIS_SECRETS.json:/cfg/JARVIS_SECRETS.json   # read-write: the UI persists secrets here
      - ./LLM_READ_ONLY_FILES:/LLM_READ_ONLY_FILES:ro
      - ./LLM_READ_WRITE_FILES:/LLM_READ_WRITE_FILES
      - ./data:/data
      - ./Logs:/logs
      - ./Prompts:/Prompts   # active + saved system/master prompt files (editable outside the app)
      - ./LLM_WORKSPACE:/LLM_WORKSPACE   # so file tools (list_dir/read_file/analyze_image/write_file) can reach the AI's workbench build area
      # Raw docker.sock mount removed — the app now uses jarvis-docker-proxy (see env above).

volumes:
  jarvis_workbench_home:
  jarvis_memory_data:
